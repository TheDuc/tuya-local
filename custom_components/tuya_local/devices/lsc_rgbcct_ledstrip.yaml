name: LED strip
products:
  - id: jdsjyhct8uotmaiw
    manufacturer: LSC Smart Connect
    model: 5m RGBIC+CCTIC
entities:
  - entity: light
    dps:
      - id: 20
        type: boolean
        name: switch
      - id: 61
        name: control_data
        type: base64
        format:
          - name: unknown1
            bytes: 1
          - name: mode
            bytes: 1
          - name: unknown2
            bytes: 1
          - name: unknown3
            bytes: 1
          - name: unknown4
            bytes: 1
          - name: hue_high
            bytes: 1
          - name: hue_low
            bytes: 1
          - name: saturation_value
            bytes: 1
          - name: brightness_value
            bytes: 1
  - entity: time
    translation_key: timer
    category: config
    dps:
      - id: 26
        type: integer
        name: second
        range:
          min: 0
          max: 86400
  - entity: text
    name: Music data
    category: config
    icon: "mdi:music"
    hidden: true
    dps:
      - id: 27
        type: string
        optional: true
        name: value
  - entity: text
    name: Control data
    category: config
    icon: "mdi:cogs"
    hidden: true
    dps:
      - id: 28
        type: string
        optional: true
        name: value
  - entity: sensor
    name: Pixels
    icon: "mdi:led-strip"
    category: diagnostic
    dps:
      - id: 47
        type: integer
        name: sensor
        unit: px
  - entity: text
    translation_key: scene
    category: config
    hidden: true
    dps:
      - id: 51
        type: string
        optional: true
        name: value
  - entity: text
    name: Dreamlight music data
    category: config
    icon: "mdi:music"
    hidden: true
    dps:
      - id: 52
        type: base64
        optional: true
        name: value
  - entity: number
    name: Set pixels
    category: config
    icon: "mdi:led-strip"
    dps:
      - id: 53
        type: integer
        name: value
        unit: px
        range:
          min: 1
          max: 1000
  - entity: text
    name: Paint data
    category: config
    icon: "mdi:palette"
    hidden: true
    dps:
      - id: 61
        type: base64
        optional: true
        name: value
